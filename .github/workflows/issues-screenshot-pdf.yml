name: Issues Screenshot PDF

# תיאור: יוצר PDF עם צילומי מסך של עמודים שדווחו עליהם בעיות.
# ה-PDF כולל מעל כל צילום:
#   - מספור דיווח (chapter N, page M, issue count)
#   - רמת חומרה (HIGH/MEDIUM/LOW)
#   - סיבת הבעיה (cause)
#   - סימון הבעיה (kind, childRect)
# ה-PDF נשמר בתיקייה חדשה עם שם המכיל את סוגי הבעיות שדווחו.
#
# מופעל ידנית דרך workflow_dispatch עם קלט:
#   - start_chapter (1-79, ברירת מחדל 1)
#   - end_chapter (1-79, ברירת מחדל 79)
#   - kind_filter (ריק = כל הסוגים, או רשימה מופרדת בפסיקים כמו "footnote-overflow,imbalance")
#   - push_to_branch (true/false — האם להוסיף commit עם ה-PDF ל-V21)

on:
  workflow_dispatch:
    inputs:
      start_chapter:
        description: 'פרק התחלתי (1-79)'
        required: false
        default: '1'
        type: string
      end_chapter:
        description: 'פרק סופי (כולל, 1-79)'
        required: false
        default: '79'
        type: string
      kind_filter:
        description: 'סינון סוגי בעיות (ריק = הכל, או: footnote-overflow,imbalance)'
        required: false
        default: ''
        type: string
      push_to_branch:
        description: 'האם להוסיף commit עם ה-PDF ל-branch V21?'
        required: false
        default: false
        type: boolean

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: Generate Issues PDF
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify project files
        run: |
          echo "=== Project files ==="
          ls -la very_long_test_text.txt index.html typesetter.js renderer.html scripts/generate-issues-pdf.js
          echo "=== Test text size ==="
          wc -c very_long_test_text.txt
          echo "=== Output dir ==="
          mkdir -p issue-reports
          ls -la issue-reports/

      - name: Start HTTP server
        run: |
          python3 -m http.server 8765 --bind 0.0.0.0 &
          sleep 3
          curl -s -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8765/index.html

      - name: Generate issues PDF
        env:
          START_CH: ${{ github.event.inputs.start_chapter }}
          END_CH: ${{ github.event.inputs.end_chapter }}
          KIND_FILTER: ${{ github.event.inputs.kind_filter }}
        run: |
          echo "=== Generating issues PDF ==="
          echo "Range: $START_CH - $END_CH"
          echo "Filter: '$KIND_FILTER'"
          ARGS="$START_CH $END_CH"
          if [ -n "$KIND_FILTER" ]; then
            ARGS="$ARGS \"$KIND_FILTER\""
          fi
          echo "Running: node scripts/generate-issues-pdf.js $ARGS"
          # הרץ ב-eval כדי לטפל בצורה נכונה בציטוטים
          eval "node scripts/generate-issues-pdf.js $ARGS" 2>&1 | tee generate-output.txt
          echo ""
          echo "=== Generated files ==="
          ls -la issue-reports/ 2>&1 | head -20

      - name: Identify generated PDF
        id: pdf
        run: |
          PDF_FILE=$(ls -t issue-reports/*.pdf 2>/dev/null | head -1)
          if [ -z "$PDF_FILE" ]; then
            echo "⚠ No PDF file generated"
            echo "name=No PDF" >> $GITHUB_OUTPUT
            exit 1
          fi
          PDF_NAME=$(basename "$PDF_FILE")
          PDF_SIZE=$(du -h "$PDF_FILE" | cut -f1)
          echo "Found PDF: $PDF_FILE"
          echo "Name: $PDF_NAME"
          echo "Size: $PDF_SIZE"
          echo "name=$PDF_NAME" >> $GITHUB_OUTPUT
          echo "path=$PDF_FILE" >> $GITHUB_OUTPUT
          echo "size=$PDF_SIZE" >> $GITHUB_OUTPUT
          # Print summary of what was captured
          echo ""
          echo "=== PDF contents summary ==="
          tail -20 generate-output.txt

      - name: Upload PDF as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issues-pdf-${{ steps.pdf.outputs.name }}
          path: |
            issue-reports/
            generate-output.txt
          retention-days: 90

      - name: Commit PDF to V21 (optional)
        if: github.event.inputs.push_to_branch == 'true' && steps.pdf.outputs.path != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # העבר את ה-PDF לתיקייה ייעודית ב-repo
          mkdir -p issue-reports-archive
          cp "${{ steps.pdf.outputs.path }}" "issue-reports-archive/${{ steps.pdf.outputs.name }}"
          git add issue-reports-archive/
          git commit -m "docs(issue-reports): ${{ steps.pdf.outputs.name }}

          PDF report with screenshots of pages with issues.
          Generated by GitHub Actions workflow 'Issues Screenshot PDF'.
          File name includes the issue kinds contained in the report."
          git push

      - name: Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Issues Screenshot PDF — Summary"
          echo "=========================================="
          echo "Chapter range: ${{ github.event.inputs.start_chapter }} - ${{ github.event.inputs.end_chapter }}"
          echo "Kind filter: ${{ github.event.inputs.kind_filter || '(all kinds)' }}"
          echo ""
          if [ -f "issue-reports/"*pdf ] || [ -f "issue-reports-archive/"*pdf ]; then
            echo "✓ PDF generated successfully"
            echo "  File: ${{ steps.pdf.outputs.name }}"
            echo "  Size: ${{ steps.pdf.outputs.size }}"
            echo ""
            echo "The PDF contains:"
            echo "  - Cover page with statistics"
            echo "  - Per-chapter dividers"
            echo "  - Per-issue blocks with:"
            echo "    * Header: kind, severity, cause, page/chapter number"
            echo "    * Full-page screenshot"
            echo "    * Audit message"
            echo "    * Issue location (childRect)"
          else
            echo "⚠ PDF was not generated — check logs above"
          fi
